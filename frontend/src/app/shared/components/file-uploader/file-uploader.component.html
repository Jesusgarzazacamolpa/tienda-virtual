<div class="space-y-3">
  <input
    #fileInput
    type="file"
    class="sr-only"
    [multiple]="multiple()"
    [attr.accept]="acceptAttribute()"
    (change)="onInputChange($event)"
  />

  <div
    role="button"
    tabindex="0"
    class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed px-6 py-10 text-center transition focus:outline-none focus:ring-2 focus:ring-brand-500/40"
    [class]="dropzoneClasses()"
    (click)="openPicker()"
    (keydown.enter)="openPicker()"
    (keydown.space)="$event.preventDefault(); openPicker()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <span class="grid h-11 w-11 place-items-center rounded-full bg-brand-500/10 text-brand-300">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-5 w-5" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 7.5 7.5 12m4.5-4.5V21"
        />
      </svg>
    </span>
    <p class="mt-3 text-sm font-medium text-white">{{ title() }}</p>
    <p class="mt-1 text-xs text-slate-400">{{ hint() ?? defaultHint() }}</p>
    <span class="mt-4 rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-200">
      Seleccionar archivo
    </span>
  </div>

  @if (error()) {
    <p class="text-xs text-rose-300" role="alert">{{ error() }}</p>
  }

  @if (selectedFiles().length > 0) {
    <ul class="divide-y divide-white/5 overflow-hidden rounded-xl border border-white/10 bg-slate-900/40">
      @for (file of selectedFiles(); track file.name + file.size; let index = $index) {
        <li class="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
          <span class="truncate text-slate-200">{{ file.name }}</span>
          <span class="flex items-center gap-3">
            <span class="text-xs text-slate-500">{{ formatSize(file.size) }}</span>
            <button
              type="button"
              class="rounded p-1 text-slate-400 transition hover:bg-white/10 hover:text-rose-300"
              [attr.aria-label]="'Quitar ' + file.name"
              (click)="$event.stopPropagation(); removeFile(index)"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </span>
        </li>
      }
    </ul>
  }
</div>
