<div
  class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-white/10 bg-slate-900/40 px-6 py-12 text-center"
>
  <span class="grid h-12 w-12 place-items-center rounded-full bg-brand-500/10 text-brand-300">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-6 w-6" aria-hidden="true">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M20.25 7.5 12 3.75 3.75 7.5m16.5 0L12 11.25M20.25 7.5v9L12 20.25m0-9L3.75 7.5m8.25 3.75v9M3.75 7.5v9L12 20.25"
      />
    </svg>
  </span>
  <h3 class="mt-4 text-sm font-semibold text-white">{{ title() }}</h3>
  <p class="mt-1 max-w-sm text-sm leading-relaxed text-slate-400">{{ message() }}</p>
  @if (actionLabel()) {
    <button
      type="button"
      class="mt-5 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/40"
      (click)="action.emit()"
    >
      {{ actionLabel() }}
    </button>
  }
</div>
