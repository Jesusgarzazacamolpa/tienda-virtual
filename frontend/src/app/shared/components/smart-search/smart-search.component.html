<div class="relative">
  <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-500">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z" />
    </svg>
  </span>

  <input
    #searchInput
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.aria-label]="placeholder()"
    (input)="onInput($event)"
    class="w-full rounded-lg border border-white/10 bg-slate-950/60 py-2 pl-10 pr-10 text-sm text-slate-100 placeholder:text-slate-500 transition hover:border-white/20 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
  />

  <span class="absolute inset-y-0 right-3 flex items-center">
    @if (loading()) {
      <span
        class="h-4 w-4 animate-spin rounded-full border-2 border-brand-400/30 border-t-brand-400"
        role="status"
        aria-label="Buscando"
      ></span>
    } @else if (value()) {
      <button
        type="button"
        aria-label="Limpiar búsqueda"
        class="rounded p-1 text-slate-400 transition hover:bg-white/10 hover:text-slate-200"
        (click)="clear()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    }
  </span>
</div>
