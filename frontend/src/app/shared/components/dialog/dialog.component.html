@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <div
      data-dialog-backdrop
      class="absolute inset-0 bg-ink-950/70 backdrop-blur-sm"
      aria-hidden="true"
      (click)="onBackdrop()"
    ></div>

    <div
      #panel
      tabindex="-1"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      [attr.aria-label]="title() ? null : 'Diálogo'"
      [attr.aria-describedby]="description() ? descriptionId : null"
      class="dialog-panel relative flex max-h-[calc(100dvh-2rem)] w-full flex-col overflow-hidden rounded-2xl border border-white/10 bg-ink-900 shadow-2xl outline-none"
      [class.max-w-sm]="size() === 'sm'"
      [class.max-w-lg]="size() === 'md'"
      [class.max-w-2xl]="size() === 'lg'"
    >
      <header class="flex items-start justify-between gap-4 border-b border-white/10 px-6 py-5">
        <div>
          <h2 [id]="titleId" class="text-base font-semibold text-white">{{ title() }}</h2>
          @if (description()) {
            <p [id]="descriptionId" class="mt-1 text-sm leading-relaxed text-slate-400">{{ description() }}</p>
          }
        </div>
        <button
          type="button"
          aria-label="Cerrar diálogo"
          class="rounded-lg p-1.5 text-slate-400 transition hover:bg-white/10 hover:text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/40"
          (click)="close()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </header>

      <div class="flex-1 overflow-y-auto px-6 py-5 text-sm leading-relaxed text-slate-300">
        <ng-content />
      </div>

      <footer
        class="dialog-footer-slot flex flex-wrap items-center justify-end gap-3 border-t border-white/10 px-6 py-4"
      >
        <ng-content select="[dialogFooter]" />
      </footer>
    </div>
  </div>
}
