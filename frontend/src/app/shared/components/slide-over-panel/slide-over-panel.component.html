<div class="fixed inset-0 z-50" [class.pointer-events-none]="!open()" [attr.aria-hidden]="!open()">
  <div
    class="absolute inset-0 bg-ink-950/70 backdrop-blur-sm transition-opacity duration-300"
    [class.opacity-0]="!open()"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <aside
    class="absolute inset-y-0 right-0 flex w-full max-w-md flex-col border-l border-white/10 bg-ink-900 shadow-2xl transition-transform duration-300 ease-out"
    [class.translate-x-full]="!open()"
    [attr.inert]="open() ? null : ''"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <header class="flex items-start justify-between gap-4 border-b border-white/10 px-6 py-5">
      <div>
        <h2 class="text-base font-semibold text-white">{{ title() }}</h2>
        @if (description()) {
          <p class="mt-1 text-sm leading-relaxed text-slate-400">{{ description() }}</p>
        }
      </div>
      <button
        type="button"
        aria-label="Cerrar panel"
        class="rounded-lg p-1.5 text-slate-400 transition hover:bg-white/10 hover:text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/40"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="flex-1 overflow-y-auto px-6 py-5">
      <ng-content />
    </div>

    <footer class="panel-footer-slot border-t border-white/10 px-6 py-4">
      <ng-content select="[panelFooter]" />
    </footer>
  </aside>
</div>
