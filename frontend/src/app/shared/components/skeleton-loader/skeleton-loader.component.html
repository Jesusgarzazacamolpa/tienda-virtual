<div class="space-y-3" role="status" aria-label="Cargando contenido">
  @for (row of rowsArray(); track $index) {
    <div class="grid gap-4" [style.grid-template-columns]="gridTemplate()">
      @for (column of columnsArray(); track $index) {
        <div class="h-3 animate-pulse rounded-full bg-white/10" [style.width.%]="barWidth($index)"></div>
      }
    </div>
  }
  <span class="sr-only">Cargando…</span>
</div>
