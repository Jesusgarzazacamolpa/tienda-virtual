<div class="flex min-h-screen bg-ink-950 text-slate-100">
  @if (menuOpen()) {
    <div class="fixed inset-0 z-30 bg-ink-950/70 backdrop-blur-sm md:hidden" (click)="menuOpen.set(false)"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-white/10 bg-ink-900 transition-transform md:static md:translate-x-0"
    [class]="menuOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <div class="flex items-center gap-3 px-5 py-5">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-sky-400 to-teal-300 text-sm font-bold text-ink-950">BO</span>
      <div>
        <p class="text-sm font-semibold">Backoffice</p>
        <p class="text-xs text-slate-400">Boilerplate B2B</p>
      </div>
    </div>

    <nav class="flex-1 space-y-1 px-3 py-2">
      <a
        routerLink="/users"
        routerLinkActive="bg-brand-500/10 text-brand-200"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-slate-200"
        (click)="menuOpen.set(false)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
          />
        </svg>
        Usuarios
      </a>

      <a
        routerLink="/reports"
        routerLinkActive="bg-brand-500/10 text-brand-200"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-slate-200"
        (click)="menuOpen.set(false)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
          />
        </svg>
        Reportería
      </a>

      <a
        routerLink="/forms"
        routerLinkActive="bg-brand-500/10 text-brand-200"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-slate-200"
        (click)="menuOpen.set(false)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12h6m-6 3h4.5M6.75 3h7.5l3.75 3.75V19.5A1.5 1.5 0 0 1 16.5 21h-9a1.5 1.5 0 0 1-1.5-1.5V4.5A1.5 1.5 0 0 1 7.5 3h-.75Z"
          />
        </svg>
        Formularios
      </a>
    </nav>

    <div class="border-t border-white/10 px-5 py-4 text-xs text-slate-500">Backoffice v1</div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex items-center gap-3 border-b border-white/10 bg-ink-950/85 px-4 py-3 backdrop-blur md:px-8">
      <button
        type="button"
        aria-label="Abrir menú"
        class="rounded-lg p-2 text-slate-400 transition hover:bg-white/5 hover:text-slate-200 md:hidden"
        (click)="menuOpen.set(true)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>

      <div class="ml-auto flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium text-slate-200">{{ displayName() }}</p>
          <p class="text-xs text-slate-500">{{ email() }}</p>
        </div>
        <span
          class="grid h-9 w-9 place-items-center rounded-full bg-brand-500/20 text-xs font-semibold text-brand-200"
          [attr.aria-label]="displayName()"
        >
          {{ initials() }}
        </span>
        @if (roles().length > 0) {
          <span class="hidden rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 text-xs font-medium text-emerald-300 sm:inline">
            {{ roles().join(' · ') }}
          </span>
        }
        <button
          type="button"
          aria-label="Cerrar sesión"
          class="rounded-lg p-2 text-slate-400 transition hover:bg-white/5 hover:text-rose-300"
          (click)="logout()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
            />
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 md:px-8">
      <router-outlet />
    </main>
  </div>
</div>
