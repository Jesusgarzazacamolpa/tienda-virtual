spring:
  application:
    name: backoffice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backoffice}
    username: ${DB_USER:backoffice}
    password: ${DB_PASSWORD:backoffice_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-32-bytes-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: ${JWT_ISSUER:backoffice}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  local-admin:
    email: ${LOCAL_ADMIN_EMAIL:admin@backoffice.local}
    password: ${LOCAL_ADMIN_PASSWORD:Admin123!}
