<header class="sticky top-0 z-40 border-b border-white/10 bg-ink-950/85 backdrop-blur">
  <div class="section-shell flex h-16 items-center justify-between gap-4 sm:h-20">
    <a href="#inicio" class="flex items-center gap-3" (click)="closeMenu()">
      <span
        class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-sky-400 to-teal-300 text-sm font-bold tracking-tight text-ink-950"
        aria-hidden="true"
      >
        GS
      </span>
      <span class="leading-tight">
        <span class="block text-sm font-semibold text-white">Garza Software Partners</span>
        <span class="block text-[11px] tracking-[0.16em] text-slate-400 uppercase">Ingeniería de software</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 lg:flex" aria-label="Navegación principal">
      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a
        href="#contacto"
        class="hidden items-center gap-2 rounded-full bg-sky-500 px-4 py-2.5 text-sm font-semibold text-ink-950 transition hover:bg-sky-400 sm:inline-flex"
      >
        Agendar auditoría
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>

      <button
        type="button"
        class="grid h-10 w-10 place-items-center rounded-lg border border-white/10 text-slate-200 transition hover:bg-white/5 lg:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        aria-label="Abrir menú de navegación"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-menu" class="border-t border-white/10 bg-ink-950 lg:hidden" aria-label="Navegación móvil">
      <div class="section-shell flex flex-col gap-1 py-4">
        @for (link of links; track link.href) {
          <a
            [href]="link.href"
            class="rounded-lg px-3 py-3 text-sm font-medium text-slate-200 transition hover:bg-white/5"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
        <a
          href="#contacto"
          class="mt-2 rounded-lg bg-sky-500 px-3 py-3 text-center text-sm font-semibold text-ink-950"
          (click)="closeMenu()"
        >
          Agendar auditoría técnica gratuita
        </a>
      </div>
    </nav>
  }
</header>
