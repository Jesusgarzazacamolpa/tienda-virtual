<section id="casos" class="relative overflow-hidden bg-ink-950 py-20 sm:py-24">
  <div class="grid-lines pointer-events-none absolute inset-0 opacity-40" aria-hidden="true"></div>

  <div class="section-shell relative">
    <app-section-heading
      eyebrow="Casos de estudio"
      tone="dark"
      title="Resultados medibles en industrias críticas."
      description="Casos reales donde la arquitectura correcta cambió la operación: menos caídas, menos trabajo manual y más control."
    />

    <div class="mt-12 grid gap-6 lg:grid-cols-3">
      @for (study of cases; track study.industry; let index = $index) {
        <article
          class="flex flex-col rounded-2xl border border-white/10 bg-white/[0.03] p-7 transition duration-200 hover:border-sky-300/30 hover:bg-white/[0.05]"
        >
          <div class="flex items-center justify-between">
            <span class="rounded-full border border-sky-300/20 bg-sky-400/10 px-3 py-1 text-[11px] font-medium text-sky-200">
              {{ study.industry }}
            </span>
            <span class="font-mono text-xs text-slate-600">0{{ index + 1 }}</span>
          </div>

          <dl class="mt-6 flex-1 space-y-5">
            <div>
              <dt class="text-[10px] font-semibold tracking-[0.18em] text-slate-500 uppercase">Reto</dt>
              <dd class="mt-1.5 text-sm leading-relaxed text-slate-300">{{ study.challenge }}</dd>
            </div>
            <div>
              <dt class="text-[10px] font-semibold tracking-[0.18em] text-slate-500 uppercase">Solución</dt>
              <dd class="mt-1.5 text-sm leading-relaxed text-slate-300">{{ study.solution }}</dd>
            </div>
            <div class="border-l-2 border-teal-300/60 pl-4">
              <dt class="text-[10px] font-semibold tracking-[0.18em] text-teal-300 uppercase">Impacto</dt>
              <dd class="mt-1.5 text-sm leading-relaxed font-medium text-white">{{ study.impact }}</dd>
            </div>
          </dl>
        </article>
      }
    </div>
  </div>
</section>
