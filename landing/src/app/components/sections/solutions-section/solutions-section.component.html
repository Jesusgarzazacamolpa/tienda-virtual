<section id="soluciones" class="bg-white py-20 sm:py-24">
  <div class="section-shell">
    <app-section-heading
      eyebrow="Soluciones"
      title="Soluciones tecnológicas alineadas a tu modelo de negocio."
      description="Tres frentes de trabajo para resolver los cuellos de botella que frenan la operación: arquitectura, automatización y presencia digital."
    />

    <div class="mt-12 grid gap-6 lg:grid-cols-3">
      @for (solution of solutions; track solution.step) {
        <article
          class="group relative flex flex-col rounded-2xl border border-slate-200 bg-white p-7 transition duration-200 hover:-translate-y-1 hover:border-sky-200 hover:shadow-xl hover:shadow-slate-900/5"
        >
          <div class="flex items-start justify-between">
            <span class="grid h-12 w-12 place-items-center rounded-xl bg-sky-50 text-sky-600">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-6 w-6" aria-hidden="true">
                @for (path of solution.paths; track path) {
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="path" />
                }
              </svg>
            </span>
            <span class="font-mono text-xs text-slate-300">{{ solution.step }}</span>
          </div>

          <h3 class="mt-6 text-lg font-semibold tracking-tight text-slate-950">
            {{ solution.title }}
          </h3>
          <p class="mt-3 flex-1 text-sm leading-relaxed text-slate-600">
            {{ solution.description }}
          </p>

          <ul class="mt-6 flex flex-wrap gap-2">
            @for (tag of solution.tags; track tag) {
              <li class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-medium text-slate-600">
                {{ tag }}
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
