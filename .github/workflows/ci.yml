name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        env:
          CI: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  landing:
    name: Landing tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Run unit tests
        working-directory: landing
        env:
          CI: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        working-directory: landing
        run: npm run build

  e2e:
    name: E2E
    needs: [backend, frontend, landing]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backoffice
          POSTGRES_USER: backoffice
          POSTGRES_PASSWORD: backoffice_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backoffice -d backoffice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install landing dependencies
        working-directory: landing
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install landing Playwright browser
        working-directory: landing
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        env:
          CI: '1'
          DB_URL: jdbc:postgresql://localhost:5432/backoffice
          DB_USER: backoffice
          DB_PASSWORD: backoffice_dev
          LOCAL_ADMIN_EMAIL: admin@backoffice.local
          LOCAL_ADMIN_PASSWORD: Admin123!
          E2E_API_URL: http://localhost:8080/api/v1
        run: npx playwright test

      - name: Run landing E2E
        working-directory: landing
        env:
          CI: '1'
          DB_URL: jdbc:postgresql://localhost:5432/backoffice
          DB_USER: backoffice
          DB_PASSWORD: backoffice_dev
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            landing/playwright-report
            landing/test-results
          if-no-files-found: ignore
          retention-days: 7
